<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#2563eb" />
  <title>수액 속도 & gtt 계산기</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --accent: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 12px 10px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      padding: 18px 16px;
    }

    .app-header {
      text-align: center;
      margin-bottom: 14px;
    }

    .app-header h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: -0.5px;
    }

    /* 상단 탭 버튼 */
    .tab-group {
      display: flex;
      background: #e2e8f0;
      padding: 3px;
      border-radius: 12px;
      margin-bottom: 16px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 9px 0;
      font-size: 0.88rem;
      font-weight: 700;
      color: #64748b;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.84rem;
      font-weight: 700;
      margin-bottom: 5px;
      color: #334155;
    }

    /* 입력창 + 단위 */
    .input-unit-group {
      display: flex;
      align-items: center;
      position: relative;
      width: 100%;
    }

    .input-unit-group input {
      width: 100%;
      height: 44px;
      padding: 0 52px 0 12px;
      font-size: 1.05rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: #ffffff;
      color: #1e293b;
    }

    .input-unit-group input:focus {
      border-color: var(--primary);
    }

    .input-unit-group .unit-label {
      position: absolute;
      right: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      pointer-events: none;
      font-weight: 700;
    }

    .time-row {
      display: flex;
      gap: 8px;
    }

    /* 빠른 선택 칩 버튼 */
    .preset-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }

    .chip {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      color: #475569;
    }

    .chip:active {
      background: #e2e8f0;
      transform: scale(0.96);
    }

    /* 결과 영역 */
    .results-card {
      margin-top: 18px;
      background: #f0f9ff;
      border: 1.5px solid #bae6fd;
      border-radius: 14px;
      padding: 16px 14px;
    }

    .main-metric {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1.5px dashed #7dd3fc;
      margin-bottom: 12px;
    }

    .main-metric .label {
      font-size: 0.82rem;
      color: var(--accent);
      font-weight: 700;
    }

    .main-metric .value {
      font-size: 2.25rem;
      font-weight: 900;
      color: #0369a1;
      line-height: 1.1;
      margin-top: 4px;
    }

    .grid-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric-item {
      background: #ffffff;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid #e0f2fe;
    }

    .metric-item.full-width {
      grid-column: span 2;
    }

    .metric-item .title {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .metric-item .data {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--text);
    }

    /* 시각적 점적 시뮬레이터 */
    .drip-simulator {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #ffffff;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }

    .drip-dot {
      width: 13px;
      height: 13px;
      background-color: #cbd5e1;
      border-radius: 50%;
      transition: background-color 0.08s;
    }

    .drip-dot.active {
      background-color: #0284c7;
      box-shadow: 0 0 8px #38bdf8;
    }

    .drip-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: #475569;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="app-header">
    <h1>💉 수액 속도 계산기</h1>
  </div>

  <!-- 탭 전환 -->
  <div class="tab-group">
    <button class="tab-btn active" onclick="switchTab('standard')">총량 & 시간</button>
    <button class="tab-btn" onclick="switchTab('rate')">cc/hr 역계산</button>
  </div>

  <!-- 공통: 점적계수 (15 -> 20 -> 60 순서 배치 & 숫자패드 지원) -->
  <div class="form-group">
    <label for="dropFactorInput">수액세트 규격 (점적계수)</label>
    <div class="input-unit-group">
      <input type="tel" inputmode="numeric" pattern="[0-9]*" id="dropFactorInput" value="20" min="1" step="1" oninput="calculate()" />
      <span class="unit-label">gtt/mL</span>
    </div>
    <div class="preset-chips">
      <button class="chip" onclick="setDropFactor(15)">15gtt (혈액)</button>
      <button class="chip" onclick="setDropFactor(20)">20gtt (표준)</button>
      <button class="chip" onclick="setDropFactor(60)">60gtt (소아)</button>
    </div>
  </div>

  <!-- TAB 1: 총량 & 시간 -->
  <div id="standardTab" class="tab-content active">
    <div class="form-group">
      <label for="volume">총 주입량</label>
      <div class="input-unit-group">
        <input type="tel" inputmode="numeric" pattern="[0-9]*" id="volume" value="500" min="1" step="1" oninput="calculate()" />
        <span class="unit-label">mL</span>
      </div>
      <div class="preset-chips">
        <button class="chip" onclick="setVolume(50)">50mL</button>
        <button class="chip" onclick="setVolume(100)">100mL</button>
        <button class="chip" onclick="setVolume(500)">500mL</button>
        <button class="chip" onclick="setVolume(1000)">1000mL</button>
      </div>
    </div>

    <div class="form-group">
      <label>주입 예정 시간</label>
      <div class="time-row">
        <div class="input-unit-group">
          <input type="tel" inputmode="numeric" pattern="[0-9]*" id="hours" value="4" min="0" placeholder="0" oninput="calculate()" />
          <span class="unit-label">시간</span>
        </div>
        <div class="input-unit-group">
          <input type="tel" inputmode="numeric" pattern="[0-9]*" id="minutes" value="0" min="0" max="59" placeholder="0" oninput="calculate()" />
          <span class="unit-label">분</span>
        </div>
      </div>
      <div class="preset-chips">
        <button class="chip" onclick="setTime(0, 30)">30분</button>
        <button class="chip" onclick="setTime(1, 0)">1시간</button>
        <button class="chip" onclick="setTime(2, 0)">2시간</button>
        <button class="chip" onclick="setTime(4, 0)">4시간</button>
        <button class="chip" onclick="setTime(8, 0)">8시간</button>
        <button class="chip" onclick="setTime(24, 0)">24시간</button>
      </div>
    </div>
  </div>

  <!-- TAB 2: cc/hr 역계산 -->
  <div id="rateTab" class="tab-content">
    <div class="form-group">
      <label for="ccPerHour">주입 속도</label>
      <div class="input-unit-group">
        <input type="tel" inputmode="numeric" pattern="[0-9]*" id="ccPerHour" value="30" min="1" step="1" oninput="calculate()" />
        <span class="unit-label">cc/hr</span>
      </div>
      <div class="preset-chips">
        <button class="chip" onclick="setRate(10)">10</button>
        <button class="chip" onclick="setRate(20)">20</button>
        <button class="chip" onclick="setRate(30)">30</button>
        <button class="chip" onclick="setRate(40)">40</button>
        <button class="chip" onclick="setRate(60)">60</button>
        <button class="chip" onclick="setRate(80)">80</button>
        <button class="chip" onclick="setRate(100)">100</button>
        <button class="chip" onclick="setRate(125)">125</button>
      </div>
    </div>

    <div class="form-group">
      <label for="targetVolume">수액 총량 (예상 완료 시간 계산용)</label>
      <div class="input-unit-group">
        <input type="tel" inputmode="numeric" pattern="[0-9]*" id="targetVolume" value="500" min="1" step="1" oninput="calculate()" />
        <span class="unit-label">mL</span>
      </div>
      <div class="preset-chips">
        <button class="chip" onclick="setTargetVolume(100)">100mL</button>
        <button class="chip" onclick="setTargetVolume(500)">500mL</button>
        <button class="chip" onclick="setTargetVolume(1000)">1000mL</button>
      </div>
    </div>
  </div>

  <!-- 결과 카드 -->
  <div class="results-card">
    <div class="main-metric">
      <div class="label">분당 점적수</div>
      <div class="value" id="gttResult">0 <span style="font-size:1.1rem; font-weight:700;">gtt</span></div>
    </div>

    <div class="grid-metrics">
      <div class="metric-item">
        <div class="title">방울 간격</div>
        <div class="data" id="secPerDropResult">0 <span style="font-size:0.8rem; font-weight:600;">초/방울</span></div>
      </div>
      <div class="metric-item">
        <div class="title">주입 속도</div>
        <div class="data" id="flowRateResult">0 <span style="font-size:0.8rem; font-weight:600;">cc/hr</span></div>
      </div>
      <div class="metric-item">
        <div class="title">초당 방울수</div>
        <div class="data" id="dropsPerSecResult">0 <span style="font-size:0.8rem; font-weight:600;">방울/초</span></div>
      </div>
      <div class="metric-item">
        <div class="title">분당 주입량</div>
        <div class="data" id="mlPerMinResult">0 <span style="font-size:0.8rem; font-weight:600;">mL/min</span></div>
      </div>
      <div class="metric-item full-width">
        <div class="title">총 예상 소요 시간</div>
        <div class="data" id="totalDurationResult">-</div>
      </div>
    </div>

    <!-- 점적 템포 시뮬레이터 -->
    <div class="drip-simulator">
      <div class="drip-dot" id="dripDot"></div>
      <div class="drip-text" id="dripStatus">템포 측정 중...</div>
    </div>
  </div>
</div>

<script>
  let activeTab = 'standard';
  let dripIntervalTimer = null;

  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
      btn.classList.toggle('active', (tab === 'standard' && idx === 0) || (tab === 'rate' && idx === 1));
    });

    document.getElementById('standardTab').classList.toggle('active', tab === 'standard');
    document.getElementById('rateTab').classList.toggle('active', tab === 'rate');

    calculate();
  }

  function setDropFactor(df) {
    document.getElementById('dropFactorInput').value = df;
    calculate();
  }

  function calculate() {
    const dropFactor = parseFloat(document.getElementById('dropFactorInput').value) || 20;
    let gtt = 0;
    let ccPerHour = 0;
    let mlPerMin = 0;
    let totalMinutes = 0;

    if (activeTab === 'standard') {
      const volume = parseFloat(document.getElementById('volume').value) || 0;
      const hours = parseFloat(document.getElementById('hours').value) || 0;
      const minutes = parseFloat(document.getElementById('minutes').value) || 0;
      totalMinutes = (hours * 60) + minutes;

      if (volume > 0 && totalMinutes > 0) {
        gtt = (volume * dropFactor) / totalMinutes;
        ccPerHour = (volume / totalMinutes) * 60;
        mlPerMin = volume / totalMinutes;
      }
    } else {
      ccPerHour = parseFloat(document.getElementById('ccPerHour').value) || 0;
      const targetVolume = parseFloat(document.getElementById('targetVolume').value) || 0;

      if (ccPerHour > 0) {
        gtt = (ccPerHour * dropFactor) / 60;
        mlPerMin = ccPerHour / 60;
        if (targetVolume > 0) {
          totalMinutes = (targetVolume / ccPerHour) * 60;
        }
      }
    }

    if (gtt <= 0) {
      document.getElementById('gttResult').innerHTML = `0 <span style="font-size:1.1rem; font-weight:700;">gtt</span>`;
      document.getElementById('flowRateResult').innerHTML = `0 <span style="font-size:0.8rem; font-weight:600;">cc/hr</span>`;
      document.getElementById('secPerDropResult').innerHTML = `- <span style="font-size:0.8rem; font-weight:600;">초/방울</span>`;
      document.getElementById('dropsPerSecResult').innerHTML = `0 <span style="font-size:0.8rem; font-weight:600;">방울/초</span>`;
      document.getElementById('mlPerMinResult').innerHTML = `0 <span style="font-size:0.8rem; font-weight:600;">mL/min</span>`;
      document.getElementById('totalDurationResult').innerText = `-`;
      document.getElementById('dripStatus').innerText = "수치를 입력해주세요";
      clearInterval(dripIntervalTimer);
      return;
    }

    const secPerDrop = 60 / gtt;
    const dropsPerSec = gtt / 60;

    const resHours = Math.floor(totalMinutes / 60);
    const resMinutes = Math.round(totalMinutes % 60);
    let durationString = "";
    if (resHours > 0) durationString += `${resHours}시간 `;
    if (resMinutes > 0 || resHours === 0) durationString += `${resMinutes}분`;
    durationString += ` (총 ${Math.round(totalMinutes)}분)`;

    document.getElementById('gttResult').innerHTML = `${gtt.toFixed(1)} <span style="font-size:1.1rem; font-weight:700;">gtt</span>`;
    document.getElementById('flowRateResult').innerHTML = `${ccPerHour.toFixed(1)} <span style="font-size:0.8rem; font-weight:600;">cc/hr</span>`;
    document.getElementById('secPerDropResult').innerHTML = `${secPerDrop.toFixed(2)} <span style="font-size:0.8rem; font-weight:600;">초에 1방울</span>`;
    document.getElementById('dropsPerSecResult').innerHTML = `${dropsPerSec.toFixed(2)} <span style="font-size:0.8rem; font-weight:600;">방울/초</span>`;
    document.getElementById('mlPerMinResult').innerHTML = `${mlPerMin.toFixed(2)} <span style="font-size:0.8rem; font-weight:600;">mL/min</span>`;
    document.getElementById('totalDurationResult').innerText = durationString;

    document.getElementById('dripStatus').innerText = `${secPerDrop.toFixed(1)}초마다 1방울 (${dropFactor}gtt/mL)`;

    startDripAnimation(secPerDrop * 1000);
  }

  function startDripAnimation(intervalMs) {
    clearInterval(dripIntervalTimer);
    if (intervalMs < 100) return;

    const dripDot = document.getElementById('dripDot');
    dripIntervalTimer = setInterval(() => {
      dripDot.classList.add('active');
      setTimeout(() => dripDot.classList.remove('active'), 120);
    }, intervalMs);
  }

  function setVolume(v) {
    document.getElementById('volume').value = v;
    calculate();
  }

  function setTime(h, m) {
    document.getElementById('hours').value = h;
    document.getElementById('minutes').value = m;
    calculate();
  }

  function setRate(r) {
    document.getElementById('ccPerHour').value = r;
    calculate();
  }

  function setTargetVolume(v) {
    document.getElementById('targetVolume').value = v;
    calculate();
  }

  // 초기 실행
  calculate();
</script>

</body>
</html>
